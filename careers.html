<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers applications · LaquTum CRM</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="careers.css"><script src="supabase.min.js" defer></script><script src="supabase-config.js" defer></script><script src="careers-roles.js" defer></script><script src="careers.js" defer></script></head><body class="admin-body"><nav class="admin-nav"><a href="dashboard.html" class="secondary-btn">← User management</a><span>LaquTum CRM</span></nav><main class="admin-main"><header class="page-header"><div><h1>Careers applications</h1><p class="admin-subtitle">Review internship applicants and their submitted details.</p></div><button id="careers-refresh" class="secondary-btn">Refresh</button></header><form id="careers-filters"><label>Search applicants<input id="careers-search" maxlength="200" placeholder="Name, email or college"></label><label>Role<select id="careers-role"><option value="">All roles</option></select></label><label>Status<select id="careers-status"><option value="">All statuses</option><option>new</option><option>reviewing</option><option>shortlisted</option><option>rejected</option><option>selected</option></select></label><button class="secondary-btn">Search</button></form><p id="careers-message" role="status" aria-live="polite">Checking access…</p><div class="table-container"><table id="careers-table"><thead><tr><th>Applicant</th><th>Role</th><th>College</th><th>Submitted</th><th>Status</th><th>Details</th></tr></thead><tbody id="careers-rows"></tbody></table></div><div class="careers-pagination"><button id="careers-prev" class="secondary-btn" disabled>Previous</button><span id="careers-page"></span><button id="careers-next" class="secondary-btn" disabled>Next</button></div></main><dialog id="careers-detail"><div class="careers-detail-header"><h2>Application details</h2><button id="careers-close" class="secondary-
